<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Echoes of Humanity — Admin Login</title>

    <meta
        name="description"
        content="Echoes of Humanity Administration Login"
    >

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../assets/js/supabase-config.js"></script>

    <style>
        :root {
            --bg: #0b1220;
            --panel: #111a2b;
            --border: #26344d;
            --text: #f4f7fb;
            --muted: #91a0b8;
            --accent: #39c6c8;
            --accent-hover: #2eb1b3;
            --danger: #ef6464;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;

            background:
                radial-gradient(
                    circle at center,
                    rgba(57, 198, 200, 0.08),
                    transparent 42%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        button,
        input {
            font: inherit;
        }

        .login-page {
            width: 100%;
            max-width: 440px;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 28px;
        }

        .brand-title {
            margin: 0;

            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .brand-subtitle {
            margin-top: 8px;

            color: var(--muted);

            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
        }

        .login-panel {
            padding: 32px;

            background: var(--panel);

            border: 1px solid var(--border);
            border-radius: 14px;

            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.28);
        }

        .login-heading {
            margin: 0 0 8px;

            font-size: 22px;
            font-weight: 700;
        }

        .login-description {
            margin: 0 0 26px;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;

            margin-bottom: 8px;

            color: var(--text);

            font-size: 13px;
            font-weight: 600;
        }

        .field input {
            width: 100%;

            padding: 12px 14px;

            background: #0d1728;

            color: var(--text);

            border: 1px solid var(--border);
            border-radius: 8px;

            outline: none;

            transition:
                border-color 0.15s ease,
                box-shadow 0.15s ease;
        }

        .field input::placeholder {
            color: #65748d;
        }

        .field input:focus {
            border-color: var(--accent);

            box-shadow:
                0 0 0 3px rgba(57, 198, 200, 0.12);
        }

        .login-button {
            width: 100%;

            margin-top: 6px;

            padding: 13px 16px;

            border: 1px solid var(--accent);
            border-radius: 8px;

            background: var(--accent);
            color: #071115;

            font-size: 14px;
            font-weight: 700;

            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                transform 0.05s ease;
        }

        .login-button:hover {
            background: var(--accent-hover);
            border-color: var(--accent-hover);
        }

        .login-button:active {
            transform: translateY(1px);
        }

        .login-button:disabled {
            cursor: not-allowed;
            opacity: 0.6;
        }

        .login-status {
            display: none;

            margin-top: 18px;
            padding: 12px 14px;

            border: 1px solid var(--border);
            border-radius: 8px;

            background: #0d1728;

            color: var(--muted);

            font-size: 13px;
            line-height: 1.5;
        }

        .login-status.visible {
            display: block;
        }

        .login-status.error {
            border-color: rgba(239, 100, 100, 0.45);
            color: #ff9b9b;
        }

        .login-footer {
            margin-top: 20px;

            text-align: center;

            color: #65748d;

            font-size: 11px;
            letter-spacing: 0.04em;
        }

        @media (max-width: 520px) {
            body {
                padding: 16px;
            }

            .login-panel {
                padding: 24px;
            }

            .brand-title {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <main class="login-page">

        <div class="login-brand">
            <h1 class="brand-title">
                Echoes of Humanity
            </h1>

            <div class="brand-subtitle">
                Administration — V3
            </div>
        </div>

        <section class="login-panel">

            <h2 class="login-heading">
                Administrator Login
            </h2>

            <p class="login-description">
                Sign in to access the Echoes of Humanity administration system.
            </p>

            <form id="loginForm">

                <div class="field">
                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="username"
                        placeholder="Enter your email"
                        required
                    >
                </div>

                <div class="field">
                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Enter your password"
                        required
                    >
                </div>

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >
                    Sign In
                </button>

                <div
                    id="loginStatus"
                    class="login-status"
                    role="status"
                    aria-live="polite"
                ></div>

            </form>

        </section>

        <div class="login-footer">
            Secure Administration System
        </div>

    </main>

</body>
</html>
