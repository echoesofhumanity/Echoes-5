<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Academy — Echoes of Humanity</title><link rel="stylesheet" href="assets/css/core.css"><link rel="stylesheet" href="assets/css/academy.css"></head><body data-page="academy"><div data-component="header"></div><main><section data-section="hero"></section><div data-section="section-01"></div><div data-section="section-02"></div><div data-section="section-03"></div><section data-section="cta"></section></main><div data-component="footer"></div><script src="assets/js/layout.js"></script><script src="assets/js/navigation.js"></script><script>document.addEventListener("click",function(e){const button=e.target.closest(".academy-button");if(!button||button.dataset.echoesNavigating==="true")return;const href=button.getAttribute("href");if(!href)return;e.preventDefault();button.dataset.echoesNavigating="true";button.classList.add("is-activating");window.setTimeout(function(){if(href.charAt(0)==="#"){const target=document.querySelector(href);if(target){target.scrollIntoView({behavior:"smooth",block:"start"});history.replaceState(null,"",href)}}else{window.location.href=href}button.classList.remove("is-activating");button.dataset.echoesNavigating="false"},700)},true);</script></body></html>
