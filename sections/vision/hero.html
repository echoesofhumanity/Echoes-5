<section class="home-hero vision-hero">
  <style>
    body[data-page="vision"] .vision-hero {
      min-height: calc(100svh - 76px);
      padding: clamp(56px, 8vw, 96px) 0;
    }

    body[data-page="vision"] .vision-hero .hero-content {
      width: min(100%, 900px);
      margin-inline: auto;
    }

    body[data-page="vision"] .vision-hero .hero-content > .eyebrow,
    body[data-page="vision"] .vision-hero .hero-content > h1,
    body[data-page="vision"] .vision-hero .hero-content > h2,
    body[data-page="vision"] .vision-hero .hero-content > .hero-lead {
      opacity: 0;
      transform: translateY(18px);
      filter: blur(5px);
      animation: echoesVisionHeroContentReveal 1100ms ease-out forwards;
    }

    body[data-page="vision"] .vision-hero .hero-content > .eyebrow {
      animation-delay: 1900ms;
    }

    body[data-page="vision"] .vision-hero .hero-content > h1 {
      max-width: 900px;
      margin-inline: auto;
      animation-delay: 2150ms;
    }

    body[data-page="vision"] .vision-hero .hero-content > h2 {
      max-width: 820px;
      margin: 24px auto 0;
      animation-delay: 2350ms;
    }

    body[data-page="vision"] .vision-hero .hero-content > .hero-lead {
      max-width: 760px;
      margin: 28px auto 0;
      line-height: 1.7;
      animation-delay: 2550ms;
    }

    @keyframes echoesVisionHeroContentReveal {
      from {
        opacity: 0;
        transform: translateY(18px);
        filter: blur(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @media (max-width: 699px) {
      body[data-page="vision"] .vision-hero {
        min-height: calc(100svh - 68px);
        padding: 42px 14px 32px;
      }

      body[data-page="vision"] .vision-hero .eyebrow {
        margin-bottom: 0.8rem;
      }

      body[data-page="vision"] .vision-hero .hero-content > h2 {
        margin-top: 1rem;
      }

      body[data-page="vision"] .vision-hero .hero-lead {
        margin-top: 1.35rem;
        line-height: 1.55;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body[data-page="vision"] .vision-hero .hero-content > .eyebrow,
      body[data-page="vision"] .vision-hero .hero-content > h1,
      body[data-page="vision"] .vision-hero .hero-content > h2,
      body[data-page="vision"] .vision-hero .hero-content > .hero-lead {
        opacity: 1;
        transform: none;
        filter: none;
        animation: none;
      }
    }
  </style>
  <div class="hero-content">
    <span class="eyebrow"><span data-i18n="hero.text01">OUR VISION</span></span>
    <h1><span data-i18n="hero.text02">A World Where Humanity Belongs.</span></h1>
    <h2><span data-i18n="hero.text03">One Humanity. One Home. One Future.</span></h2>
    <p class="hero-lead"><span data-i18n="hero.text04">We envision a borderless human community where dignity is protected, compassion becomes action and every person can find a place to learn, create, contribute and belong.</span></p>
  </div>
</section>
