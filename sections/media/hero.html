<section class="hero page-hero cinematic-page-hero media-hero">
  <style>
    body[data-page="media"] .media-hero {
      min-height: calc(100svh - 76px);
      padding: clamp(56px, 8vw, 96px) 0;
    }

    body[data-page="media"] .media-hero .hero-content {
      width: min(100%, 900px);
      margin-inline: auto;
    }

    body[data-page="media"] .media-hero .hero-content > .eyebrow,
    body[data-page="media"] .media-hero .hero-content > h1,
    body[data-page="media"] .media-hero .hero-content > .hero-lead,
    body[data-page="media"] .media-hero .hero-content > .hero-actions {
      opacity: 0;
      transform: translateY(18px);
      filter: blur(5px);
      animation: echoesMediaHeroContentReveal 1100ms ease-out forwards;
    }

    body[data-page="media"] .media-hero .hero-content > .eyebrow {
      animation-delay: 1900ms;
    }

    body[data-page="media"] .media-hero .hero-content > h1 {
      max-width: 900px;
      margin-inline: auto;
      animation-delay: 2150ms;
    }

    body[data-page="media"] .media-hero .hero-content > .hero-lead {
      max-width: 760px;
      margin: 28px auto 0;
      line-height: 1.7;
      animation-delay: 2550ms;
    }

    body[data-page="media"] .media-hero .hero-content > .hero-actions {
      margin-top: 30px;
      animation-delay: 3250ms;
    }

    @keyframes echoesMediaHeroContentReveal {
      from {
        opacity: 0;
        transform: translateY(18px);
        filter: blur(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }
    }

    @media (max-width: 699px) {
      body[data-page="media"] .media-hero {
        min-height: calc(100svh - 68px);
        padding: 14px 14px 12px;
      }

      body[data-page="media"] .media-hero .hero-content {
        width: min(100%, 560px);
      }

      body[data-page="media"] .media-hero .eyebrow {
        margin-bottom: 0.35rem;
      }

      body[data-page="media"] .media-hero .hero-content > h1 {
        font-size: clamp(2.35rem, 10.7vw, 3.15rem);
        line-height: 0.98;
      }

      body[data-page="media"] .media-hero .hero-lead {
        margin-top: 0.65rem;
        font-size: clamp(1rem, 4.55vw, 1.28rem);
        line-height: 1.34;
      }

      body[data-page="media"] .media-hero .hero-actions {
        margin-top: 0.75rem;
        gap: 0.4rem;
      }

      body[data-page="media"] .media-hero .hero-actions .cinematic-btn {
        min-height: 46px;
        padding-block: 0.58rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      body[data-page="media"] .media-hero .hero-content > .eyebrow,
      body[data-page="media"] .media-hero .hero-content > h1,
      body[data-page="media"] .media-hero .hero-content > .hero-lead,
      body[data-page="media"] .media-hero .hero-content > .hero-actions {
        opacity: 1;
        transform: none;
        filter: none;
        animation: none;
      }
    }
  </style>
  <div class="hero-atmosphere" aria-hidden="true"></div>
  <div class="hero-content">
    <span class="eyebrow"><span data-i18n="hero.text001">ECHOES GLOBAL MEDIA NETWORK</span></span>
    <h1><span data-i18n="hero.text002">Humanity Has More Than One Story.</span></h1>
    <p class="hero-lead"><span data-i18n="hero.text003">News and truth. Music and laughter. Culture and creativity. Protection and learning. A global media network built to inform, entertain, inspire, connect and remember.</span></p>
    <div class="hero-actions">
      <a class="cinematic-btn cinematic-btn-primary" href="#channels"><span data-i18n="hero.text004">Explore the Network</span></a>
      <a class="cinematic-btn cinematic-btn-secondary" href="#create"><span data-i18n="hero.text005">Create With Echoes</span></a>
    </div>
  </div>
</section>
