  <style>
    body[data-page="home"] .echoes-journey{z-index:0}
    body[data-page="home"] .echoes-journey-field{z-index:-1}
    body[data-page="home"] .echoes-human-light-field{z-index:0;filter:none}

    body[data-page="home"] main{position:relative}
    body[data-page="home"] .echoes-pulse-light{
      position:absolute;
      z-index:2;
      pointer-events:none;
      border-radius:50%;
      background:radial-gradient(circle,rgba(95,208,197,.58) 0%,rgba(95,208,197,.24) 24%,rgba(95,208,197,.08) 48%,rgba(95,208,197,0) 76%);
      box-shadow:0 0 28px rgba(95,208,197,.12);
      opacity:.34;
      transform:translate(-50%,-50%) scale(.78);
      animation:echoesAtmosphericPulse 8s ease-in-out infinite;
    }
    body[data-page="home"] .echoes-pulse-light-01{width:92px;height:92px;left:14%;top:335vh;animation-delay:-1.5s}
    body[data-page="home"] .echoes-pulse-light-02{width:132px;height:132px;left:82%;top:570vh;animation-delay:-4s}
    body[data-page="home"] .echoes-pulse-light-03{width:74px;height:74px;left:18%;top:790vh;animation-delay:-2.5s}
    @keyframes echoesAtmosphericPulse{
      0%,100%{opacity:.20;transform:translate(-50%,-50%) scale(.76);filter:blur(1.2px)}
      50%{opacity:.72;transform:translate(-50%,-50%) scale(1.18);filter:blur(.2px)}
    }
  </style>
