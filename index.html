  <style>
    body[data-page="home"] .echoes-journey{z-index:0}
    body[data-page="home"] .echoes-journey-field{z-index:-1}
    body[data-page="home"] .echoes-human-light-field{z-index:0;filter:none}
    body[data-page="home"] .echoes-human-light-01{top:72vh}

    body[data-page="home"] main{position:relative}
    body[data-page="home"] .echoes-pulse-light{
      position:absolute;
      z-index:2;
      pointer-events:none;
      border-radius:50%;
      background:radial-gradient(circle,rgba(95,208,197,.34) 0%,rgba(95,208,197,.13) 24%,rgba(95,208,197,.038) 49%,rgba(95,208,197,0) 76%);
      box-shadow:0 0 28px rgba(95,208,197,.06);
      opacity:.22;
      transform:translate(-50%,-50%) scale(.88);
      animation:echoesAtmosphericPulse 11s ease-in-out infinite;
    }
    body[data-page="home"] .echoes-pulse-light-01{width:88px;height:88px;right:8%;left:auto;top:430vh;animation-delay:-1.5s}
    body[data-page="home"] .echoes-pulse-light-02{width:112px;height:112px;left:12%;top:735vh;animation-delay:-4s}
    body[data-page="home"] .echoes-pulse-light-03{width:72px;height:72px;right:10%;left:auto;top:950vh;animation-delay:-2.5s}
    @keyframes echoesAtmosphericPulse{
      0%,100%{opacity:.13;transform:translate(-50%,-50%) scale(.86);filter:blur(1.8px)}
      50%{opacity:.40;transform:translate(-50%,-50%) scale(1.08);filter:blur(.8px)}
    }
  </style>
</head>
