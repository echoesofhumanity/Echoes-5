  <script>
    document.addEventListener("echoes:layout-ready", async function () {
      if (!window.EchoesMerchandiseCatalog) return;
      try {
        const entries = await window.EchoesMerchandiseCatalog.load();
        const cards = Array.from(document.querySelectorAll("[data-concept-product]"));
        const catalog = new Map(entries.map(function (entry) {
          return [entry.concept_id, entry];
        }));
        const cardIds = cards.map(function (card) { return card.dataset.conceptProduct; });
        const valid = cards.length === entries.length &&
          new Set(cardIds).size === cards.length && cards.every(function (card) {
          const entry = catalog.get(card.dataset.conceptProduct);
          return entry && card.dataset.databaseProductId === entry.database_product_id;
        });
        document.body.dataset.merchandiseCatalogStatus = valid ? "matched" : "mismatch";
        if (!valid) {
          console.warn("Merchandise catalog/card identity mismatch");
          return;
        }
        const selection = window.EchoesMarketplaceSelection;
        if (!selection) return;
        // Single-storefront, read-only selection summary; never authorizes checkout.
        const cartSummary = document.createElement("aside");
        cartSummary.setAttribute("aria-live", "polite");
        cartSummary.style.cssText = "max-width:760px;margin:22px auto;padding:18px;border:1px solid #806752;border-radius:16px;background:#1d1b20;color:#f2e7d9;text-align:center";
        const cartTitle = document.createElement("strong");
        const cartCount = document.createElement("p");
        const cartLines = document.createElement("ul");
        cartLines.style.cssText = "list-style:none;padding:0;margin:12px 0;text-align:left";
        const cartTotal = document.createElement("p");
        cartTotal.style.cssText = "font-weight:700";
        // Reuse the existing validated synthetic catalog and calculation engine.
        const demoProducts = await window.EchoesMarketplaceCatalog.load();
        const productsByConcept = new Map(demoProducts.map(function (product) {
          return [product.concept_id, product];
        }));
        if (entries.length !== demoProducts.length || entries.some(function (entry) {
          const product = productsByConcept.get(entry.concept_id);
          return !product || product.product_id !== entry.database_product_id.toLowerCase() ||
            product.checkout_enabled !== false;
        })) throw new Error("Merchandise and synthetic catalog identities differ");
        const cartNotice = document.createElement("p");
        cartNotice.style.cssText = "font-size:.85rem;opacity:.8";
        cartSummary.append(cartTitle, cartCount, cartLines, cartTotal, cartNotice);
        const cartTranslations = {
          en:["Selected merchandise","Items selected: ","Concept preview only. Checkout and payment are unavailable."],
          tr:["Seçilen ürünler","Seçilen ürün adedi: ","Yalnızca kavramsal ön izleme. Satın alma ve ödeme kullanılamıyor."],
          de:["Ausgewählte Artikel","Ausgewählte Anzahl: ","Nur Konzeptvorschau. Kauf und Zahlung nicht verfügbar."],
          fr:["Articles sélectionnés","Quantité sélectionnée : ","Aperçu conceptuel uniquement. Achat et paiement indisponibles."],
          es:["Artículos seleccionados","Cantidad seleccionada: ","Solo vista conceptual. Compra y pago no disponibles."],
          pt:["Artigos selecionados","Quantidade selecionada: ","Apenas prévia conceitual. Compra e pagamento indisponíveis."],
          ru:["Выбранные товары","Выбрано единиц: ","Только концептуальный просмотр. Покупка и оплата недоступны."],
          ar:["المنتجات المختارة","عدد المنتجات: ","معاينة تصورية فقط. الشراء والدفع غير متاحين."],
          zh:["已选商品","已选数量：","仅供概念预览，暂不支持购买或付款。"]
        };
        function refreshCartSummary() {
          const language = (window.EchoesI18n && window.EchoesI18n.getLanguage()) || "en";
          const words = cartTranslations[language] || cartTranslations.en;
          cartTitle.textContent = words[0];
          const selected = selection.read();
          cartCount.textContent = words[1] + selected.reduce(function (sum, line) { return sum + line.quantity; }, 0);
          cartLines.replaceChildren();
          let totalEC = 0;
          if (selected.length) {
            const calculated = window.EchoesMarketplaceCart.calculate(demoProducts,
              selected.map(function (line) {
                const product = productsByConcept.get(line.concept_id);
                if (!product) throw new Error("Unknown merchandise selection");
                return { product_id: product.product_id, quantity: line.quantity };
              }));
            totalEC = calculated.total_ec;
            calculated.lines.forEach(function (line) {
              const product = demoProducts.find(function (item) { return item.product_id === line.product_id; });
              const item = document.createElement("li");
              item.style.cssText = "padding:8px 0;border-bottom:1px solid #655448";
              item.textContent = product.title + " × " + line.quantity + " — " +
                line.subtotal_ec.toLocaleString(language) + " EC";
              cartLines.appendChild(item);
            });
          }
          cartTotal.textContent = "EC: " + totalEC.toLocaleString(language);
          cartNotice.textContent = words[2];
        }
        // Original storefront's local-only synthetic order flow.
        const orderPanel = document.createElement("dialog");
        orderPanel.style.cssText = "box-sizing:border-box;width:min(760px,calc(100% - 24px));max-height:calc(100dvh - 32px);overflow:auto;margin:auto;padding:22px;border:1px solid #806752;border-radius:16px;background:#151b23;color:#f2e7d9;text-align:center";
        orderPanel.id = "echoes-synthetic-checkout";
        const orderHeading = document.createElement("h2");
        const orderReview = document.createElement("div");
        orderReview.style.cssText = "white-space:pre-line;text-align:left;line-height:1.8;margin:14px 0";
        const orderState = document.createElement("p");
        orderState.setAttribute("role","status");
        orderState.setAttribute("aria-live","polite");
        const orderButtons = ["calculate","create","confirm","fulfill","cancel"].map(function(action){
          const button=document.createElement("button");
          button.type="button";
          button.dataset.orderAction=action;
          button.style.cssText="display:block;width:100%;min-height:48px;margin:10px 0;padding:12px;border-radius:12px;border:1px solid #dfb98e;background:#76503a;color:white;font-weight:600";
          return button;
        });
        const closeOrder = document.createElement("button");
        closeOrder.type="button";
        closeOrder.textContent="×";
        closeOrder.setAttribute("aria-label","Close synthetic cart");
        closeOrder.style.cssText="float:right;min-width:48px;min-height:48px;border:1px solid #dfb98e;border-radius:12px;background:#29465b;color:white;font-size:1.5rem";
        closeOrder.addEventListener("click",function(){orderPanel.close();});
        orderState.style.cssText="position:sticky;bottom:0;z-index:2;min-height:44px;padding:12px;border:1px solid #806752;border-radius:10px;background:#24313b;color:#fff;text-align:left;white-space:pre-line";
        orderState.textContent="Demo only — no real payment.";
        orderPanel.append(closeOrder,orderHeading,orderReview,orderState,...orderButtons);
        function orderWords(){
          const lang=(window.EchoesI18n&&window.EchoesI18n.getLanguage())||"en";
          const words={
            en:["Synthetic cart","Calculate demo cart","Create synthetic order","Confirm demo order","Cancel demo order","Select a product first.","Synthetic order created: ","Synthetic order confirmed: ","Synthetic order cancelled: ","Simulation only. No real order, payment or EC transfer.","Total: ","Order status: "],
            tr:["Sentetik sepet","Demo sepetini hesapla","Sentetik sipariş oluştur","Demo siparişini onayla","Demo siparişini iptal et","Önce ürün seçin.","Sentetik sipariş oluşturuldu: ","Sentetik sipariş onaylandı: ","Sentetik sipariş iptal edildi: ","Yalnızca simülasyon. Gerçek sipariş, ödeme veya EC transferi yok.","Toplam: ","Sipariş durumu: "],
            de:["Synthetischer Warenkorb","Demo-Warenkorb berechnen","Testbestellung erstellen","Testbestellung bestätigen","Testbestellung stornieren","Zuerst Artikel auswählen.","Testbestellung erstellt: ","Testbestellung bestätigt: ","Testbestellung storniert: ","Nur Simulation. Keine echte Bestellung, Zahlung oder EC-Übertragung.","Gesamt: ","Bestellstatus: "],
            fr:["Panier synthétique","Calculer le panier démo","Créer une commande fictive","Confirmer la commande fictive","Annuler la commande fictive","Sélectionnez un article.","Commande fictive créée : ","Commande fictive confirmée : ","Commande fictive annulée : ","Simulation uniquement. Aucun achat, paiement ou transfert EC réel.","Total : ","Statut : "],
            es:["Carrito sintético","Calcular carrito demo","Crear pedido sintético","Confirmar pedido demo","Cancelar pedido demo","Selecciona un producto.","Pedido sintético creado: ","Pedido confirmado: ","Pedido cancelado: ","Solo simulación. Sin pedido, pago ni transferencia EC real.","Total: ","Estado: "],
            pt:["Carrinho sintético","Calcular carrinho demo","Criar pedido sintético","Confirmar pedido demo","Cancelar pedido demo","Selecione um produto.","Pedido sintético criado: ","Pedido confirmado: ","Pedido cancelado: ","Apenas simulação. Sem pedido, pagamento ou transferência EC real.","Total: ","Estado: "],
            ru:["Синтетическая корзина","Рассчитать демо-корзину","Создать тестовый заказ","Подтвердить тестовый заказ","Отменить тестовый заказ","Сначала выберите товар.","Тестовый заказ создан: ","Заказ подтверждён: ","Заказ отменён: ","Только симуляция. Без реального заказа, оплаты или перевода EC.","Итого: ","Статус: "],
            ar:["سلة اصطناعية","حساب السلة التجريبية","إنشاء طلب تجريبي","تأكيد الطلب التجريبي","إلغاء الطلب التجريبي","اختر منتجًا أولاً.","تم إنشاء الطلب: ","تم تأكيد الطلب: ","تم إلغاء الطلب: ","محاكاة فقط. لا طلب أو دفع أو تحويل EC حقيقي.","الإجمالي: ","الحالة: "],
            zh:["模拟购物车","计算模拟购物车","创建模拟订单","确认模拟订单","取消模拟订单","请先选择商品。","模拟订单已创建：","模拟订单已确认：","模拟订单已取消：","仅供模拟，不涉及真实订单、付款或 EC 转账。","总计：","订单状态："]
          };return words[lang]||words.en;
        }
        function calculatedSelection(){
          const selected=selection.read();
          if(!selected.length)return null;
          return window.EchoesMarketplaceCart.calculate(demoProducts,selected.map(function(line){
            const product=productsByConcept.get(line.concept_id);
            if(!product)throw Error("Unknown product");
            return {product_id:product.product_id,quantity:line.quantity};
          }));
        }
        function refreshOrderPanel(){
          const words=orderWords(),cart=calculatedSelection(),order=window.EchoesMarketplaceSyntheticOrder.status();
          const active=!!order&&["created","confirmed"].includes(order.status);
          const lang=(window.EchoesI18n&&window.EchoesI18n.getLanguage())||"en";
          const terms={
            tr:["Azalt","Artır","Kaldır","Miktar","Sipariş geçmişi","Sepet boş"],
            en:["Decrease","Increase","Remove","Quantity","Order history","Cart is empty"],
            de:["Verringern","Erhöhen","Entfernen","Menge","Bestellverlauf","Warenkorb leer"],
            fr:["Diminuer","Augmenter","Retirer","Quantité","Historique","Panier vide"],
            es:["Reducir","Aumentar","Quitar","Cantidad","Historial","Carrito vacío"],
            pt:["Diminuir","Aumentar","Remover","Quantidade","Histórico","Carrinho vazio"],
            ru:["Уменьшить","Увеличить","Удалить","Количество","История","Корзина пуста"],
            ar:["تقليل","زيادة","إزالة","الكمية","السجل","السلة فارغة"],
            zh:["减少","增加","移除","数量","订单记录","购物车为空"]
          }[lang]||["Decrease","Increase","Remove","Quantity","Order history","Cart is empty"];
          orderHeading.textContent=words[0];
          closeOrder.setAttribute("aria-label",lang==="tr"?"Sepeti kapat":"Close synthetic cart");
          orderButtons.forEach(function(button,i){
            button.textContent=i===3?({tr:"Demo siparişini tamamla",en:"Complete demo order",de:"Testbestellung abschließen",fr:"Terminer la commande fictive",es:"Completar pedido demo",pt:"Concluir pedido demo",ru:"Завершить тестовый заказ",ar:"إكمال الطلب التجريبي",zh:"完成模拟订单"}[lang]||"Complete demo order"):words[i<3?i+1:4];
          });
          orderReview.replaceChildren();
          // All four validated catalogue products must remain selectable from the cart,
          // including products not yet present in the current selection.
          const available=demoProducts.filter(function(product){
            return !selection.read().some(function(line){return line.concept_id===product.concept_id;});
          });
          if(available.length&&!active){
            const picker=document.createElement("div");
            picker.style.cssText="padding:12px 0;margin:8px 0 16px;border-bottom:1px solid #806752";
            const pickerLabel=document.createElement("strong");
            pickerLabel.textContent=({tr:"Başka ürün ekle",en:"Add another product",de:"Weiteres Produkt hinzufügen",fr:"Ajouter un autre article",es:"Añadir otro producto",pt:"Adicionar outro produto",ru:"Добавить другой товар",ar:"إضافة منتج آخر",zh:"添加其他商品"}[lang]||"Add another product");
            pickerLabel.style.display="block";
            picker.append(pickerLabel);
            available.forEach(function(product){
              const add=document.createElement("button");
              add.type="button";
              add.textContent="+ "+product.title+" — "+product.price_ec.toLocaleString(lang)+" EC";
              add.style.cssText="display:block;width:100%;min-height:48px;margin:10px 0;padding:10px;border:1px solid #dfb98e;border-radius:10px;background:#29465b;color:white;text-align:left";
              add.addEventListener("click",function(){
                try{
                  selection.setQuantity(product.concept_id,1);
                  refreshCartSafely();
                  refreshOrderPanel();
                  orderState.textContent="";
                }catch(error){orderState.textContent=error.message||words[5];}
              });
              picker.append(add);
            });
            orderReview.append(picker);
          }
          if(cart){
            cart.lines.forEach(function(line){
              const product=demoProducts.find(function(p){return p.product_id===line.product_id});
              if(!product)return;
              const row=document.createElement("div");
              row.style.cssText="padding:12px 0;border-bottom:1px solid #806752";
              const name=document.createElement("strong");
              name.textContent=product.title+" — "+line.subtotal_ec.toLocaleString(lang)+" EC";
              name.style.display="block";
              const controls=document.createElement("div");
              controls.style.cssText="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:10px";
              const minus=document.createElement("button"),plus=document.createElement("button"),remove=document.createElement("button"),quantity=document.createElement("input");
              quantity.type="number";quantity.min="0";quantity.max="99";quantity.step="1";quantity.value=String(line.quantity);
              quantity.disabled=active;
              quantity.setAttribute("aria-label",terms[3]+": "+product.title);
              quantity.style.cssText="box-sizing:border-box;width:70px;min-height:44px;text-align:center;border:1px solid #dfb98e;border-radius:8px;background:#24313b;color:white;font-size:16px";
              [minus,plus,remove].forEach(function(button){
                button.type="button";button.style.cssText="min-width:44px;min-height:44px;padding:8px;border:1px solid #dfb98e;border-radius:8px;background:#29465b;color:white";
              });
              minus.textContent="−";plus.textContent="+";remove.textContent=terms[2];
              minus.setAttribute("aria-label",terms[0]+": "+product.title);
              plus.setAttribute("aria-label",terms[1]+": "+product.title);
              remove.setAttribute("aria-label",terms[2]+": "+product.title);
              minus.disabled=active||line.quantity<=1;
              plus.disabled=active||line.quantity>=99;
              remove.disabled=active;
              function changeQuantity(value){
                try{
                  if(active||!Number.isSafeInteger(value)||value<0||value>99)throw Error("Invalid demo quantity");
                  selection.setQuantity(product.concept_id,value);
                  refreshCartSafely();
                  refreshOrderPanel();
                  orderState.textContent="";
                }catch(error){orderState.textContent=error.message||words[5];quantity.value=String(line.quantity);}
              }
              minus.addEventListener("click",function(){changeQuantity(line.quantity-1);});
              plus.addEventListener("click",function(){changeQuantity(line.quantity+1);});
              remove.addEventListener("click",function(){changeQuantity(0);});
              quantity.addEventListener("change",function(){changeQuantity(Number(quantity.value));});
              controls.append(minus,quantity,plus,remove);
              row.append(name,controls);orderReview.append(row);
            });
            const total=document.createElement("p");
            total.style.fontWeight="700";
            total.textContent=words[10]+cart.total_ec.toLocaleString(lang)+" EC";
            orderReview.append(total);
          }else{
            const empty=document.createElement("p");empty.textContent=terms[5];orderReview.append(empty);
          }
          if(order){
            const history=document.createElement("p");
            history.textContent=words[11]+order.status+" ("+order.id+")"+"\n"+terms[4]+": "+order.history.map(function(x){return x.to;}).join(" → ");
            orderReview.append(history);
          }
          orderButtons[0].disabled=!cart||active;
          orderButtons[1].disabled=!cart||active;
          orderButtons[2].disabled=!order||order.status!=="created";
          orderButtons[3].disabled=!order||order.status!=="confirmed";
          orderButtons[4].disabled=!order||!["created","confirmed","fulfilled"].includes(order.status);
          if(order&&order.status==="fulfilled")orderButtons[4].textContent=lang==="tr"?"Tamamlanan demo siparişini geri al":"Reverse completed demo order";
          orderButtons.forEach(function(button){
            button.style.opacity=button.disabled?".42":"1";
            button.style.cursor=button.disabled?"not-allowed":"pointer";
          });
          const guidance={
            tr:["Sepet hesaplanabilir. Sipariş oluşturmak için ikinci düğmeye basın.","Sipariş oluşturuldu. Şimdi onaylayabilir veya iptal edebilirsiniz.","Sipariş onaylandı. Tamamlayabilir veya iptal edebilirsiniz.","Sipariş tamamlandı. Yeni sentetik sipariş oluşturabilirsiniz.","Sipariş iptal edildi. Yeni sentetik sipariş oluşturabilirsiniz."],
            en:["Cart is ready. Create a synthetic order next.","Order created. Confirm or cancel it.","Order confirmed. Complete or cancel it.","Order completed. You may create a new synthetic order.","Order cancelled. You may create a new synthetic order."]
          };
          const help=guidance[lang]||guidance.en;
          if(!order)orderState.textContent=cart?help[0]:words[5];
          else if(order.status==="created")orderState.textContent=help[1]+"\n"+order.id;
          else if(order.status==="confirmed")orderState.textContent=help[2]+"\n"+order.id;
          else if(order.status==="fulfilled")orderState.textContent=help[3]+"\n"+order.id;
          else if(order.status==="cancelled")orderState.textContent=help[4]+"\n"+order.id;
          else if(order.status==="reversed")orderState.textContent=(lang==="tr"?"Tamamlanan demo siparişi geri alındı. Geçmiş korundu.":"Completed demo order reversed. History retained.")+"\n"+order.id;
        }
        orderButtons.forEach(function(button){
          button.addEventListener("click",function(){
            try{
              const action=button.dataset.orderAction, words=orderWords(), engine=window.EchoesMarketplaceSyntheticOrder;
              if(action==="calculate"){const calculated=calculatedSelection();if(!calculated)throw Error(words[5]);refreshOrderPanel();orderState.textContent=words[9]+"\n"+words[10]+calculated.total_ec.toLocaleString()+" EC";return;}
              else if(action==="create"){const order=engine.create(calculatedSelection());orderState.textContent=words[6]+order.id;}
              else if(action==="confirm"){const order=engine.confirm();orderState.textContent=words[7]+order.id;}
              else if(action==="fulfill"){const order=engine.fulfill();orderState.textContent="DEMO: "+order.status+" ("+order.id+")";}
              else if(action==="cancel"){const current=engine.status();const order=current&&current.status==="fulfilled"?engine.reverse():engine.cancel();orderState.textContent=order.status==="reversed"?(words[8]+order.id+" (reversed)"):words[8]+order.id;}
              refreshOrderPanel();
            }catch(error){orderState.textContent="Demo error: "+(error.message||orderWords()[5]);console.warn("Synthetic order action failed",error);}
          });
        });
        refreshOrderPanel();
        document.addEventListener("echoes:languagechange",refreshOrderPanel);
        const productMount = document.querySelector('[data-section="products"]');
        if (productMount) { productMount.insertAdjacentElement("afterend", cartSummary); cartSummary.insertAdjacentElement("afterend", orderPanel); }
        function refreshCartSafely() {
          try {
            refreshCartSummary();
            document.body.dataset.merchandiseCartStatus = "ready";
          } catch (error) {
            document.body.dataset.merchandiseCartStatus = "unavailable";
            cartLines.replaceChildren();
            cartCount.textContent = "";
            cartTotal.textContent = "";
            cartNotice.textContent = window.EchoesMerchDemoText(10);
            console.warn("Merchandise selection summary unavailable", error);
          }
        }
        refreshCartSafely();
        document.addEventListener("echoes:languagechange", function () {
          refreshCartSafely();
          document.querySelectorAll("[data-echoes-merch-quantity-label]").forEach(function (node) {
            node.setAttribute("aria-label", window.EchoesMerchDemoText(1));
          });
          document.querySelectorAll("[data-echoes-merch-minus]").forEach(function (node) {
            node.setAttribute("aria-label", window.EchoesMerchDemoText(2));
          });
          document.querySelectorAll("[data-echoes-merch-plus]").forEach(function (node) {
            node.setAttribute("aria-label", window.EchoesMerchDemoText(3));
          });
          document.querySelectorAll("[data-echoes-merch-detail]").forEach(function (area) {
            const label = area.querySelector("[data-echoes-merch-label]");
            const existing = area.querySelector("[data-echoes-merch-existing]");
            const button = area.querySelector("[data-echoes-merch-button]");
            const status = area.querySelector("[data-echoes-merch-status]");
            if (label) label.textContent = window.EchoesMerchDemoText(0);
            if (existing) {
              const id = area.dataset.echoesMerchDetail;
              const line = selection.read().find(function (item) { return item.concept_id === id; });
              existing.textContent = line ? window.EchoesMerchDemoText(11) + line.quantity : window.EchoesMerchDemoText(12);
              if (button) button.textContent = window.EchoesMerchDemoText(line ? 4 : 13);
            }
            if (status) status.textContent = "";
          });
        });
        const detailIds = ["echoes-tee-detail", "echoes-hoodie-detail", "echoes-bottle-detail", "echoes-notebook-detail"];
        detailIds.forEach(function (detailId, index) {
          const dialog = document.getElementById(detailId);
          const card = cards[index];
          if (!dialog || !card) return;
          const entry = catalog.get(card.dataset.conceptProduct);
          if (!entry || entry.checkout_enabled !== false) return;
          const inside = dialog.querySelector(".echoes-tee-detail__inside");
          if (!inside) return;
          const area = document.createElement("div");
          area.dataset.echoesMerchDetail = entry.concept_id;
          area.style.cssText = "margin:22px 0 8px;padding:18px;border:1px solid rgba(223,185,142,.38);border-radius:16px;background:#211d20";
          const label = document.createElement("p");
          label.dataset.echoesMerchLabel = "";
          label.textContent = window.EchoesMerchDemoText(0);
          label.style.cssText = "margin:0 0 12px;color:#dfb98e;font-size:.85rem";
          const quantityRow = document.createElement("div");
          quantityRow.style.cssText = "display:flex;align-items:center;justify-content:center;gap:16px;margin:12px 0 18px";
          const minus = document.createElement("button");
          const plus = document.createElement("button");
          const amount = document.createElement("output");
          amount.dataset.echoesMerchQuantityLabel = "";
          let quantity = 1;
          amount.textContent = String(quantity);
          amount.setAttribute("aria-label", window.EchoesMerchDemoText(1));
          amount.style.cssText = "min-width:32px;text-align:center;font-weight:700;font-size:1.2rem;color:#fff";
          [minus, plus].forEach(function (control) {
            control.type = "button";
            control.style.cssText = "width:52px;min-height:48px;border:1px solid #bca18b;border-radius:12px;background:#28232a;color:#f3efe5;font-size:1.4rem;cursor:pointer";
          });
          minus.dataset.echoesMerchMinus = "";
          plus.dataset.echoesMerchPlus = "";
          minus.textContent = "−";
          plus.textContent = "+";
          minus.setAttribute("aria-label", window.EchoesMerchDemoText(2));
          plus.setAttribute("aria-label", window.EchoesMerchDemoText(3));
          function refreshQuantity() {
            amount.textContent = String(quantity);
            minus.disabled = quantity <= 0;
            plus.disabled = quantity >= 99;
            minus.style.opacity = minus.disabled ? ".4" : "1";
            plus.style.opacity = plus.disabled ? ".4" : "1";
          }
          minus.addEventListener("click", function () {
            quantity = Math.max(0, quantity - 1);
            refreshQuantity();
          });
          plus.addEventListener("click", function () {
            quantity = Math.min(99, quantity + 1);
            refreshQuantity();
          });
          refreshQuantity();
          quantityRow.append(minus, amount, plus);
          const button = document.createElement("button");
          button.dataset.echoesMerchButton = "";
          button.type = "button";
          button.textContent = window.EchoesMerchDemoText(4);
          button.style.cssText = "width:100%;min-height:48px;padding:12px;border:1px solid #dfb98e;border-radius:12px;background:#76503a;color:#fff0d8;font-weight:600;cursor:pointer";
          const status = document.createElement("p");
          status.dataset.echoesMerchStatus = "";
          status.setAttribute("role", "status");
          status.setAttribute("aria-live", "polite");
          status.style.cssText = "margin:10px 0 0;font-size:.85rem;color:#e8d4b9";
          const inlineTotal = document.createElement("p");
          inlineTotal.style.cssText = "margin:12px 0;color:#f2e7d9;font-weight:700;text-align:center";
          inlineTotal.setAttribute("aria-live", "polite");
          function refreshInlineTotal() {
            try {
              const selected = selection.read();
              if (!selected.length) {
                inlineTotal.textContent = "EC: 0";
                return;
              }
              const calculated = window.EchoesMarketplaceCart.calculate(demoProducts,
                selected.map(function (line) {
                  const product = productsByConcept.get(line.concept_id);
                  if (!product) throw new Error("Unknown merchandise selection");
                  return { product_id: product.product_id, quantity: line.quantity };
                }));
              const language = (window.EchoesI18n && window.EchoesI18n.getLanguage()) || "en";
              inlineTotal.textContent = "EC: " + calculated.total_ec.toLocaleString(language);
            } catch (error) {
              inlineTotal.textContent = window.EchoesMerchDemoText(10);
            }
          }
          const existing = document.createElement("p");
          existing.dataset.echoesMerchExisting = "";
          existing.style.cssText = "margin:10px 0;color:#dfb98e;font-size:.9rem";
          function refreshExisting() {
            const line = selection.read().find(function (item) { return item.concept_id === entry.concept_id; });
            const savedQuantity = line ? line.quantity : 0;
            existing.textContent = line ? window.EchoesMerchDemoText(11) + savedQuantity : window.EchoesMerchDemoText(12);
            // New concepts start at one; zero remains available via the minus button for removal.
            quantity = line ? savedQuantity : 1;
            refreshQuantity();
            button.textContent = savedQuantity ? window.EchoesMerchDemoText(4) : window.EchoesMerchDemoText(13);
          }
          const opener = card.querySelector(".echoes-tee-open");
          if (opener) opener.addEventListener("click", function () {
            status.textContent = "";
            refreshExisting();
            refreshInlineTotal();
          });
          refreshExisting();
          refreshInlineTotal();
          button.addEventListener("click", function () {
            try {
              const lines = selection.setQuantity(entry.concept_id, quantity);
              const total = lines.reduce(function (sum, line) { return sum + line.quantity; }, 0);
              status.textContent = quantity === 0
                ? window.EchoesMerchDemoText(7)
                : window.EchoesMerchDemoText(8) + total + window.EchoesMerchDemoText(9);
              refreshExisting();
              refreshCartSafely();
              refreshInlineTotal();
              refreshOrderPanel();
            } catch (error) {
              status.textContent = window.EchoesMerchDemoText(10);
            }
          });
          const goToOrder = document.createElement("button");
          goToOrder.type = "button";
          goToOrder.dataset.echoesMerchGoOrder = "";
          goToOrder.style.cssText = "display:block;width:100%;min-height:48px;margin:14px 0 0;padding:12px;border:1px solid #dfb98e;border-radius:12px;background:#29465b;color:#fff;font-weight:700;cursor:pointer";
          function updateGoToOrder() {
            const language = (window.EchoesI18n && window.EchoesI18n.getLanguage()) || "en";
            const captions = {tr:"Sentetik sepete geç →",en:"Go to synthetic cart →",de:"Zum Testwarenkorb →",fr:"Voir le panier fictif →",es:"Ir al carrito sintético →",pt:"Ir para o carrinho sintético →",ru:"Перейти в тестовую корзину →",ar:"الانتقال إلى السلة التجريبية ←",zh:"前往模拟购物车 →"};
            goToOrder.textContent = captions[language] || captions.en;
            goToOrder.disabled = !selection.read().length;
          }
          goToOrder.addEventListener("click", function () {
            try {
              refreshCartSafely();
              refreshOrderPanel();
              const target = document.getElementById("echoes-synthetic-checkout");
              if (!target || !target.isConnected) throw new Error("Synthetic cart section unavailable");
              // The cart is a native modal: no document scroll position is involved.
              if (typeof dialog.close === "function" && dialog.open) dialog.close();
              requestAnimationFrame(function () {
                if (!orderPanel.open) orderPanel.showModal();
              });
            } catch (error) {
              status.textContent = window.EchoesMerchDemoText(10);
            }
          });
          document.addEventListener("echoes:languagechange", updateGoToOrder);
          updateGoToOrder();
          area.append(label, existing, quantityRow, button, status, inlineTotal, goToOrder);
          inside.appendChild(area);
        });
      } catch (error) {
        document.body.dataset.merchandiseCatalogStatus = "unavailable";
        console.warn("Merchandise catalog validation unavailable", error);
      }
    }, { once: true });
  </script>
  <script src="assets/js/navigation.js"></script>
</body>
</html>
