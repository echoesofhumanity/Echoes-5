<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merchandise — Echoes of Humanity</title>
  <link rel="stylesheet" href="assets/css/core.css?v=a73a9986">
</head>
<body data-page="merchandise">
  <div data-component="header"></div>
  <main>
    <section data-section="hero"></section>
    <div data-section="products"></div>
    <div data-section="section-02"></div>
    <div data-section="section-03"></div>
    <section data-section="cta"></section>
  </main>
  <div data-component="footer"></div>
  <script src="assets/js/layout.js"></script>
  <script src="assets/js/merchandise-catalog.js?v=92a43e3"></script>
  <script src="assets/js/marketplace-demo-selection.js?v=08dfae8"></script>
  <script>
    document.addEventListener("echoes:layout-ready", async function () {
      if (!window.EchoesMerchandiseCatalog) return;
      try {
        const entries = await window.EchoesMerchandiseCatalog.load();
        const cards = Array.from(document.querySelectorAll("[data-concept-product]"));
        const catalog = new Map(entries.map(function (entry) {
          return [entry.concept_id, entry];
        }));
        const cardIds = cards.map(function (card) { return card.dataset.conceptProduct; });
        const valid = cards.length === entries.length &&
          new Set(cardIds).size === cards.length && cards.every(function (card) {
          const entry = catalog.get(card.dataset.conceptProduct);
          return entry && card.dataset.databaseProductId === entry.database_product_id;
        });
        document.body.dataset.merchandiseCatalogStatus = valid ? "matched" : "mismatch";
        if (!valid) {
          console.warn("Merchandise catalog/card identity mismatch");
          return;
        }
        const selection = window.EchoesMarketplaceDemoSelection;
        if (!selection) return;
        const detailIds = ["echoes-tee-detail", "echoes-hoodie-detail", "echoes-bottle-detail", "echoes-notebook-detail"];
        detailIds.forEach(function (detailId, index) {
          const dialog = document.getElementById(detailId);
          const card = cards[index];
          if (!dialog || !card) return;
          const entry = catalog.get(card.dataset.conceptProduct);
          if (!entry || entry.checkout_enabled !== false) return;
          const inside = dialog.querySelector(".echoes-tee-detail__inside");
          if (!inside) return;
          const area = document.createElement("div");
          area.style.cssText = "margin:22px 0 8px;padding:18px;border:1px solid rgba(112,224,210,.35);border-radius:16px;background:#10252b";
          const label = document.createElement("p");
          label.textContent = "DEMO ONLY — No real purchase or payment";
          label.style.cssText = "margin:0 0 12px;color:#a4e7df;font-size:.85rem";
          const quantityRow = document.createElement("div");
          quantityRow.style.cssText = "display:flex;align-items:center;justify-content:center;gap:16px;margin:12px 0 18px";
          const minus = document.createElement("button");
          const plus = document.createElement("button");
          const amount = document.createElement("output");
          let quantity = 1;
          amount.textContent = String(quantity);
          amount.setAttribute("aria-label", "Demo quantity");
          amount.style.cssText = "min-width:32px;text-align:center;font-weight:700;font-size:1.2rem;color:#fff";
          [minus, plus].forEach(function (control) {
            control.type = "button";
            control.style.cssText = "width:52px;min-height:48px;border:1px solid #87dfd5;border-radius:12px;background:#16363d;color:#fff;font-size:1.4rem;cursor:pointer";
          });
          minus.textContent = "−";
          plus.textContent = "+";
          minus.setAttribute("aria-label", "Decrease demo quantity");
          plus.setAttribute("aria-label", "Increase demo quantity");
          function refreshQuantity() {
            amount.textContent = String(quantity);
            minus.disabled = quantity <= 0;
            plus.disabled = quantity >= 99;
            minus.style.opacity = minus.disabled ? ".4" : "1";
            plus.style.opacity = plus.disabled ? ".4" : "1";
          }
          minus.addEventListener("click", function () {
            quantity = Math.max(0, quantity - 1);
            refreshQuantity();
          });
          plus.addEventListener("click", function () {
            quantity = Math.min(99, quantity + 1);
            refreshQuantity();
          });
          refreshQuantity();
          quantityRow.append(minus, amount, plus);
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = "Update demo cart";
          button.style.cssText = "width:100%;min-height:48px;padding:12px;border:1px solid #87dfd5;border-radius:12px;background:#164d4c;color:#fff;font-weight:600;cursor:pointer";
          const status = document.createElement("p");
          status.setAttribute("role", "status");
          status.setAttribute("aria-live", "polite");
          status.style.cssText = "margin:10px 0 0;font-size:.85rem;color:#c5e8e3";
          const existing = document.createElement("p");
          existing.style.cssText = "margin:10px 0;color:#a4e7df;font-size:.9rem";
          function refreshExisting() {
            const line = selection.read().find(function (item) { return item.concept_id === entry.concept_id; });
            const savedQuantity = line ? line.quantity : 0;
            existing.textContent = line ? "Already in demo cart: " + savedQuantity : "Not yet in demo cart";
            quantity = savedQuantity;
            refreshQuantity();
            button.textContent = savedQuantity ? "Update demo cart" : "Add to demo cart";
          }
          const opener = card.querySelector(".echoes-tee-open");
          if (opener) opener.addEventListener("click", function () {
            status.textContent = "";
            refreshExisting();
          });
          refreshExisting();
          const goToCart = document.createElement("a");
          goToCart.href = "marketplace-demo.html";
          goToCart.textContent = "View demo cart →";
          goToCart.hidden = true;
          goToCart.style.cssText = "display:block;margin-top:14px;padding:12px;text-align:center;border:1px solid #87dfd5;border-radius:12px;color:#b8f4ec;text-decoration:none";
          goToCart.setAttribute("aria-label", "View demo cart in this tab");
          button.addEventListener("click", function () {
            try {
              const lines = selection.setQuantity(entry.concept_id, quantity);
              const total = lines.reduce(function (sum, line) { return sum + line.quantity; }, 0);
              status.textContent = quantity === 0
                ? "Removed from demo cart. No order or payment created."
                : "Demo cart updated. Items: " + total + ". No order or payment created.";
              goToCart.hidden = total === 0;
              refreshExisting();
            } catch (error) {
              status.textContent = "Demo cart unavailable. Please try again.";
            }
          });
          area.append(label, existing, quantityRow, button, status, goToCart);
          inside.appendChild(area);
        });
      } catch (error) {
        document.body.dataset.merchandiseCatalogStatus = "unavailable";
        console.warn("Merchandise catalog validation unavailable", error);
      }
    }, { once: true });
  </script>
  <script src="assets/js/navigation.js"></script>
</body>
</html>
