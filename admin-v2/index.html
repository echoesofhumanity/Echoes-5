<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Echoes Admin Panel V2</title>
  
  <!-- Supabase CDN ve Proje Yapılandırması -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/js/supabase-config.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 24px; border-radius: 12px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid #334155; padding-bottom: 16px; }
    .nav-btns { display: flex; gap: 10px; }
    button { background: #3b82f6; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
    button:hover { opacity: 0.9; }
    .btn-secondary { background: #475569; }
    .btn-success { background: #22c55e; }
    .btn-warning { background: #eab308; color: #000; }
    .btn-danger { background: #ef4444; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; font-size: 0.9rem; color: #cbd5e1; }
    input, select, textarea { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: white; font-size: 0.95rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .alert { padding: 12px; border-radius: 6px; margin-bottom: 16px; display: none; }
    .alert.info { background: #1e3a8a; color: #93c5fd; display: block; }
    .alert.success { background: #14532d; color: #86efac; display: block; }
    .alert.error { background: #7f1d1d; color: #fca5a5; display: block; }
    .card { background: #0f172a; padding: 16px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #334155; }
    .card-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-sm { padding: 4px 10px; font-size: 0.8rem; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h2 style="color: #38bdf8;">Echoes Admin Panel V2</h2>
    <div class="nav-btns">
      <button id="navNewContent">Yeni İçerik</button>
      <button id="navLibrary" class="btn-secondary">İçerik Kütüphanesi</button>
<button onclick="try{if(typeof db!=='undefined'&amp;&amp;db.auth){db.auth.signOut();}}catch(e){} localStorage.clear(); window.location.href='login.html';" class="btn-danger" style="background:#ef4444; color:#fff; border:none; padding:8px 16px; border-radius:6px; cursor:pointer;">Çıkış Yap</button>
      
      
    </div>
  </div>

  <div id="statusAlert" class="alert"></div>

  <!-- Form Sekmesi -->
  <div id="sectionForm">
    <h3 id="formTitle" style="margin-bottom: 16px;">Yeni İçerik Ekle</h3>
    <form id="contentForm" onsubmit="return false;">
      <input type="hidden" id="editingId">
      
      <div class="form-group">
        <label>Başlık *</label>
        <input type="text" id="contentTitle" required placeholder="İçerik başlığı">
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>Tip</label>
          <select id="contentType">
            <option value="story">Story</option>
            <option value="essay">Essay</option>
            <option value="manifesto">Manifesto</option>
            <option value="poetry">Poetry</option>
            <option value="audio">Audio</option>
            <option value="visual">Visual</option>
          </select>
        </div>
        <div class="form-group">
          <label>Dil</label>
          <select id="contentLanguage">
            <option value="tr">Türkçe</option>
            <option value="en">English</option>
            <option value="de">Deutsch</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>Kategori</label>
        <input type="text" id="contentCategory" placeholder="Örn: general, test">
      </div>

      <div class="form-group">
        <label>Açıklama</label>
        <textarea id="contentDescription" rows="4" placeholder="İçerik detayı..."></textarea>
      </div>

      <div class="form-group">
        <label>Etiketler (Virgülle ayırın)</label>
        <input type="text" id="contentTags" placeholder="humanity, story, art">
      </div>

      <div class="form-group">
        <label>Medya Dosyası (İsteğe Bağlı)</label>
        <input type="file" id="contentFile">
      </div>

      <div style="display: flex; gap: 10px; margin-top: 20px;">
        <button type="button" id="btnClear" class="btn-secondary">Temizle</button>
        <button type="button" id="btnSaveDraft" class="btn-warning">Taslak Kaydet</button>
        <button type="button" id="btnPublish" class="btn-success">Yayınla</button>
      </div>
    </form>
  </div>

  <!-- Kütüphane Sekmesi -->
  <div id="sectionLibrary" style="display: none;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
      <h3>Kayıtlı İçerikler</h3>
      <button id="btnRefresh" class="btn-secondary btn-sm">Yenile</button>
    </div>
    <div id="libraryList">Yükleniyor...</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase-config.js"></script>
<script src="js/supabase-client.js"></script>
<script src="admin.js"></script>
<script src="js/auth.js"></script>
  
</body>
</html>
