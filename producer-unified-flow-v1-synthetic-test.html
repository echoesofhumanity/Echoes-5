;images.forEach(x=>{const img=document.createElement('img');img.src=x.url;img.alt=x.name;$('preview').append(img)});if(state.product==='approved'||state.placed||state.collection){try{state=P.transition(state,owner,'revise_images',{imageCount:images.length});log.push('revise_images · '+owner.id)}catch(err){message=t('denied')+': '+err.message}}message=images.length+' '+t('linked');update()};$('runFlow').onclick=()=>{try{const r=P.selfTest();message=t('flowPass')+': '+r.passed+'/13'}catch(e){message=t('flowFail')+': '+e.message}update()};$('reset').onclick=()=>{images.forEach(x=>URL.revokeObjectURL(x.url));images=[];state=null;log=[];message='';$('preview').replaceChildren();$('files').value='';for(const id of ['name','description','target','create'])$(id).disabled=false;update()};$('language').onchange=e=>{lang=e.target.value;try{localStorage.setItem('echoes.language',lang)}catch(x){}update()};update();</script></body></html>
