name: Marketplace Synthetic Tests

on:
  push:
    branches: [main]
    paths:
      - 'merchandise.html'
      - 'marketplace.html'
      - 'storefront.html'
      - 'sections/merchandise/products.html'
      - 'assets/data/marketplace-catalog.json'
      - 'assets/js/marketplace-*.js'
      - 'tests/marketplace-cart.test.js'
      - 'tests/marketplace-catalog-cart-integration.test.js'
      - 'assets/data/merchandise-catalog.json'
      - 'assets/js/merchandise-catalog.js'
      - 'tests/marketplace-selection.test.js'
      - 'tests/marketplace-synthetic-order.test.js'
      - 'tests/marketplace-language-switch-contract.test.js'
      - 'tests/marketplace-merchandise-consistency.test.js'
      - 'sections/marketplace/stores.html'
      - 'sections/marketplace/storefronts.html'
      - 'assets/js/i18n.js'
      - 'tests/marketplace-single-demo-boundary.test.js'
      - '.github/workflows/marketplace-synthetic-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Verify Node.js runtime
        run: node --version
      - name: Verify Merchandise uses canonical modules
        run: |
          grep -Fq 'assets/js/marketplace-catalog.js' merchandise.html
          grep -Fq 'assets/js/marketplace-cart.js' merchandise.html
          grep -Fq 'assets/js/marketplace-selection.js' merchandise.html
          grep -Fq 'assets/data/marketplace-catalog.json' assets/js/marketplace-catalog.js
          if grep -Eq 'marketplace-demo-(catalog|cart|selection|order)\.js|marketplace-demo\.html' merchandise.html; then exit 1; fi
      - name: Check JavaScript syntax before executing tests
        run: |
          node --check assets/js/marketplace-catalog.js
          node --check assets/js/merchandise-catalog.js
          node --check assets/js/marketplace-cart.js
          node --check assets/js/marketplace-selection.js
          node --check assets/js/marketplace-synthetic-order.js
          node --check assets/js/marketplace-v2-bridge.js
          node --check tests/marketplace-cart.test.js
          node --check tests/marketplace-catalog-cart-integration.test.js
          node --check tests/marketplace-selection.test.js
          node --check tests/marketplace-synthetic-order.test.js
          node --check tests/marketplace-language-switch-contract.test.js
          node --check tests/marketplace-merchandise-consistency.test.js
          node --check tests/marketplace-single-demo-boundary.test.js
      - name: Validate shared Marketplace catalogue and cart
        run: node tests/marketplace-cart.test.js
      - name: Validate all four products and quantity boundaries
        run: node tests/marketplace-catalog-cart-integration.test.js
      - name: Validate shared Marketplace selection
        run: node tests/marketplace-selection.test.js
      - name: Validate synthetic order lifecycle and reversals
        run: node tests/marketplace-synthetic-order.test.js
      - name: Guard Marketplace and Merchandise page consistency
        run: node tests/marketplace-merchandise-consistency.test.js
      - name: Guard nine-language dynamic Merchandise updates
        run: node tests/marketplace-language-switch-contract.test.js
      - name: Guard canonical single-demo integration and old links
        run: node tests/marketplace-single-demo-boundary.test.js
