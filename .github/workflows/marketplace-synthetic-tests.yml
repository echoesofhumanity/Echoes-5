name: Marketplace Synthetic Tests

on:
  push:
    branches: [main]
    paths:
      - 'merchandise.html'
      - 'assets/data/marketplace-catalog.json'
      - 'assets/js/marketplace-*.js'
      - 'tests/marketplace-cart.test.js'
      - 'tests/marketplace-selection.test.js'
      - '.github/workflows/marketplace-synthetic-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-synthetic-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@v4
      - name: Verify Node.js runtime
        run: node --version
      - name: Verify Merchandise uses canonical modules
        run: |
          grep -Fq 'assets/js/marketplace-catalog.js' merchandise.html
          grep -Fq 'assets/js/marketplace-cart.js' merchandise.html
          grep -Fq 'assets/js/marketplace-selection.js' merchandise.html
          grep -Fq 'assets/data/marketplace-catalog.json' assets/js/marketplace-catalog.js
          if grep -Eq 'marketplace-demo-(catalog|cart|selection)\\.js' merchandise.html; then exit 1; fi
      - name: Validate shared Marketplace catalogue and cart
        run: node tests/marketplace-cart.test.js
      - name: Validate shared Marketplace selection
        run: node tests/marketplace-selection.test.js
