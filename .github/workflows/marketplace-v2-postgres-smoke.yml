name: Marketplace V2 isolated PostgreSQL smoke
on:
  push:
    paths:
      - 'tests/marketplace-v2-postgres-smoke.sql'
      - 'tests/marketplace-v2-postgres-multicart.sql'
      - 'tests/marketplace-v2-postgres-concurrency.sh'
      - 'tests/marketplace-v2-postgres-cancel-race.sh'
      - 'tests/marketplace-v2-real-schema.sql'
      - 'tests/marketplace-v2-real-rpc.sql'
      - 'tests/marketplace-v2-real-security.sql'
      - 'tests/marketplace-v2-real-auth-boundary.sql'
      - 'tests/marketplace-v2-real-jwt-boundary.sql'
      - 'tests/marketplace-v2-least-privilege.sql'
      - 'tests/marketplace-v2-scoped-rls.sql'
      - 'tests/marketplace-v2-bridge.test.mjs'
      - 'assets/js/marketplace-v2-bridge.js'
      - 'marketplace-demo.html'
      - '.github/workflows/marketplace-v2-postgres-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  disposable-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d fixture"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: PostgreSQL transaction smoke tests (disposable, no Supabase credentials)
        env:
          PGHOST: localhost
          PGPORT: '5432'
          PGUSER: fixture
          PGPASSWORD: fixture-only
          PGDATABASE: fixture
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/marketplace-v2-postgres-smoke.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/marketplace-v2-postgres-multicart.sql
          bash tests/marketplace-v2-postgres-concurrency.sh
          bash tests/marketplace-v2-postgres-cancel-race.sh
          psql -X -v ON_ERROR_STOP=1 -f tests/marketplace-v2-real-schema.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/marketplace-v2-real-rpc.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/marketplace-v2-real-security.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/marketplace-v2-real-auth-boundary.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/marketplace-v2-real-jwt-boundary.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/marketplace-v2-least-privilege.sql
          psql -X -v ON_ERROR_STOP=1 -f tests/marketplace-v2-scoped-rls.sql
          node --test tests/marketplace-v2-bridge.test.mjs
