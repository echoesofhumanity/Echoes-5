name: Governance phone-only real caption translation
on:
  workflow_dispatch:
    inputs:
      source_language:
        description: 'Konusma dili / Source language'
        type: choice
        required: true
        default: tr
        options:
          - tr
          - en
          - ru
          - es
          - de
      sample_text:
        description: 'Public test sentence only (no private meeting content)'
        type: string
        required: true
        default: 'İnsan onurunu korumak ortak sorumluluğumuzdur.'
permissions:
  contents: write
concurrency:
  group: governance-phone-caption-publish
  cancel-in-progress: false
jobs:
  captions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_LANGUAGE: ${{ inputs.source_language }}
      SAMPLE_TEXT: ${{ inputs.sample_text }}
      GH_TOKEN: ${{ github.token }}
      GH_REPOSITORY: ${{ github.repository }}
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Argos engine
        run: python -m pip install --disable-pip-version-check 'argostranslate==1.9.6'
      - name: Translate one public sentence into four caption languages
        run: |
          python - <<'PY'
          import os
          import json, base64, urllib.request, urllib.error
          from datetime import datetime, timezone
          import argostranslate.package as package
          import argostranslate.translate as translate

          langs=('tr','en','ru','es','de')
          src=os.environ['SOURCE_LANGUAGE']
          phrase=os.environ['SAMPLE_TEXT'].strip()
          assert src in langs, 'Unsupported source language'
          assert phrase and len(phrase)<=1200, 'Text must contain 1-1200 characters'
          package.update_package_index()
          available=package.get_available_packages()
          edges=set()
          for dst in langs:
              if dst==src:
                  continue
              if src=='en' or dst=='en':
                  edges.add((src,dst))
              else:
                  edges.add((src,'en'))
                  edges.add(('en',dst))
          for source,target in sorted(edges):
              choices=[p for p in available if p.from_code==source and p.to_code==target]
              assert choices, f'Missing model {source}->{target}'
              model=choices[0]
              print(f'Installing {source}->{target} v{model.package_version}',flush=True)
              package.install_from_path(model.download())
          captions={src:phrase}
          print('--- ACTUAL ARGOS CAPTIONS (not a live meeting) ---',flush=True)
          print(f'SOURCE {src}: {phrase}',flush=True)
          for dst in langs:
              if dst==src:
                  continue
              if src=='en' or dst=='en':
                  output=translate.translate(phrase,src,dst)
              else:
                  pivot=translate.translate(phrase,src,'en')
                  assert pivot.strip(), f'Empty pivot {src}->en'
                  output=translate.translate(pivot,'en',dst)
              assert output.strip(), f'Empty output {src}->{dst}'
              captions[dst]=output
              print(f'CAPTION {dst}: {output}',flush=True)
          # PUBLIC sample only. Never enter private meeting speech in workflow inputs.
          payload={'schemaVersion':1,'source':src,'captions':captions,'generatedAt':datetime.now(timezone.utc).isoformat(),'type':'public-test-only','live':False}
          url=f"https://api.github.com/repos/{os.environ['GH_REPOSITORY']}/contents/governance-argos-latest-captions.json"
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','User-Agent':'echoes-governance-test'}
          sha=None
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=20) as resp:
                  sha=json.load(resp)['sha']
          except urllib.error.HTTPError as exc:
              if exc.code!=404: raise
          data={'message':'test(governance): publish public caption sample','branch':'main','content':base64.b64encode(json.dumps(payload,ensure_ascii=False).encode()).decode()}
          if sha: data['sha']=sha
          req=urllib.request.Request(url,data=json.dumps(data).encode(),headers=headers,method='PUT')
          with urllib.request.urlopen(req,timeout=30) as resp:
              assert resp.status in (200,201)
          print('PUBLISHED: public captions JSON for mobile preview.',flush=True)
          print('PASS: four actual Argos captions returned.',flush=True)
          print('LIMITATIONS: batch test only; no microphone, live captions, JaaS, TTS, or certified translation quality.',flush=True)
          PY
