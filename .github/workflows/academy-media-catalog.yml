name: Academy media catalog checks
on:
  push:
    branches: [main]
    paths:
      - 'academy/catalog/**'
      - 'academy-tests/check-media-catalog.cjs'
      - 'academy-learning-lab.html'
      - '.github/workflows/academy-media-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Academy catalog and intro regressions
        run: node academy-tests/check-media-catalog.cjs
