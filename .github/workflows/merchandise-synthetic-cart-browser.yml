name: Merchandise synthetic cart browser regression
on:
  pull_request:
    paths:
      - 'merchandise.html'
      - 'tests/merchandise-synthetic-cart-browser.cjs'
      - '.github/workflows/merchandise-synthetic-cart-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cart-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser harness
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test actual merchandise UI on mobile and desktop
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/merch-cart-http.log 2>&1 &
          node tests/merchandise-synthetic-cart-browser.cjs
