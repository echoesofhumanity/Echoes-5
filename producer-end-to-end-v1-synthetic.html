<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Echoes · End-to-End Synthetic Workflow</title><style>:root{font-family:system-ui,sans-serif;background:#061827;color:#e8f6fa}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% 0%,#175063,#061827 65%);min-height:100vh}main{max-width:760px;margin:auto;padding:20px 16px 60px}h1{font-size:clamp(1.5rem,5vw,2.2rem)}p{line-height:1.5;color:#b8d3de}.eyebrow{letter-spacing:.12em;color:#77e6dd;font-size:.75rem}.panel{border:1px solid #366a7c;background:#0c2b3c;border-radius:17px;padding:18px;margin:16px 0}.notice{background:#103b49;padding:14px;border-radius:12px}label{display:block;margin:12px 0 5px}input[type=text],select,button{font:inherit;padding:11px;border:1px solid #478395;border-radius:10px;background:#0b3244;color:white}input[type=text],select{width:100%}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.primary{background:#20bcb1;color:#06262c;font-weight:700}.check{display:flex;align-items:center;gap:10px;margin:12px 0}.check input{accent-color:#25c4b7;width:20px;height:20px}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{flex:1}.status{display:inline-block;border-radius:20px;padding:7px 12px;background:#174b5c}.record{border:1px solid #1ebeb2;border-radius:13px;padding:14px;margin-top:14px;overflow-wrap:anywhere}[hidden]{display:none!important}html[dir=rtl] main{text-align:right}</style></head><body><main><div class="eyebrow">ECHOES OF HUMANITY · SYNTHETIC BRIDGE V1</div><h1 id="heading"></h1><select id="lang" aria-label="Language"><option value="en">English</option><option value="tr">Türkçe</option><option value="ar">العربية</option><option value="es">Español</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="pt">Português</option><option value="ru">Русский</option><option value="zh">简体中文</option></select><p class="notice" id="notice"></p><section class="panel"><h2>1 · Seller application / Üretici başvurusu</h2><label for="sellerName">Seller / Üretici</label><input id="sellerName" type="text" maxlength="100"><label for="sellerInfo">Description / Açıklama</label><input id="sellerInfo" type="text" maxlength="300"><button id="submitSeller">Submit / Başvur</button><p id="sellerStatus" role="status"></p><h2>2 · Seller review / Satıcı denetimi</h2><label for="reason">Reason / Gerekçe</label><input id="reason" type="text" maxlength="300"><button id="approveSeller">Approve seller / Satıcıyı onayla</button><button id="rejectSeller">Reject seller / Satıcıyı reddet</button><h2>3 · Product application / Ürün başvurusu</h2><label id="nameLabel" for="name"></label><input id="name" type="text" maxlength="100" autocomplete="off" value="Echoes Test Product"><label id="typeLabel" for="type"></label><select id="type"><option value="physical"></option><option value="digital"></option></select><label id="targetLabel" for="target"></label><select id="target"><option value="marketplace"></option><option value="merchandise"></option></select><button id="submitProduct">Submit product / Ürünü gönder</button><p id="productStatus" role="status"></p><h2>4 · Product review / Ürün denetimi</h2><button id="approveProduct">Approve product / Ürünü onayla</button><button id="rejectProduct">Reject product / Ürünü reddet</button><button id="approveCollection">Collection approval / Koleksiyon onayı</button><h2>5 · Storefront / Vitrin</h2><div class="actions"><button class="primary" id="place"></button><button id="remove"></button></div><p><span class="status" id="status"></span></p><p id="feedback" role="status" aria-live="polite"></p></section><section class="panel" id="preview" hidden><strong id="previewLabel"></strong><div class="record"><h2 id="previewName"></h2><p id="previewDetails"></p></div></section></main><script>(()=>{'use strict';const dict={"tr":["Mal kabul → mağaza aktarımı","Yalnızca sentetik test. Gerçek katalog, ödeme ve dosya kaydı yok.","Ürün adı","Ürün türü","Fiziksel","Dijital","Hedef mağaza","Marketplace","Merchandise","Satıcı onayı","Ürün onayı","Koleksiyon onayı","Aktarımı doğrula","Vitrinden kaldır","Onay bekliyor","Aktarım hazır","Vitrinde","Aktarım engellendi: gerekli onaylar eksik.","Ürün sentetik vitrine aktarıldı.","Sentetik ürün vitrinden kaldırıldı.","Sentetik vitrin kaydı","Ürün adı gerekli.","Merchandise için koleksiyon onayı zorunludur."],"en":["Acceptance → storefront handoff","Synthetic test only. No real catalogue, payments or files.","Product name","Product type","Physical","Digital","Destination","Marketplace","Merchandise","Seller approval","Product approval","Collection approval","Verify handoff","Remove from storefront","Awaiting approval","Ready to hand off","In storefront","Handoff blocked: approvals missing.","Product transferred to synthetic storefront.","Synthetic product removed.","Synthetic storefront record","Product name is required.","Collection approval required for Merchandise."],"ar":["نقل القبول إلى المتجر","اختبار تجريبي فقط، دون كتالوج أو دفع أو ملفات حقيقية.","اسم المنتج","نوع المنتج","مادي","رقمي","المتجر المستهدف","Marketplace","Merchandise","اعتماد البائع","اعتماد المنتج","اعتماد المجموعة","تأكيد النقل","إزالة من المتجر","بانتظار الاعتماد","جاهز للنقل","في المتجر","النقل محظور: الموافقات ناقصة.","تم النقل إلى المتجر التجريبي.","تمت إزالة المنتج.","سجل المتجر التجريبي","اسم المنتج مطلوب.","يلزم اعتماد المجموعة لـ Merchandise."],"es":["Aceptación → tienda","Solo prueba simulada. Sin catálogo, pagos ni archivos reales.","Nombre del producto","Tipo de producto","Físico","Digital","Tienda de destino","Marketplace","Merchandise","Aprobación del vendedor","Aprobación del producto","Aprobación de colección","Verificar transferencia","Retirar de tienda","Pendiente","Listo para transferir","En tienda","Transferencia bloqueada: faltan aprobaciones.","Producto transferido a la tienda simulada.","Producto retirado.","Registro de tienda simulada","Se requiere el nombre.","Merchandise requiere aprobación de colección."],"fr":["Acceptation → boutique","Test simulé uniquement. Aucun catalogue, paiement ou fichier réel.","Nom du produit","Type de produit","Physique","Numérique","Boutique cible","Marketplace","Merchandise","Validation vendeur","Validation produit","Validation collection","Vérifier le transfert","Retirer de la boutique","En attente","Prêt au transfert","En boutique","Transfert bloqué : validations manquantes.","Produit transféré vers la boutique simulée.","Produit retiré.","Fiche de boutique simulée","Nom du produit requis.","Validation de collection requise pour Merchandise."],"de":["Freigabe → Shop-Übergabe","Nur Simulation. Kein echter Katalog, keine Zahlungen oder Dateien.","Produktname","Produkttyp","Physisch","Digital","Ziel-Shop","Marketplace","Merchandise","Verkäuferfreigabe","Produktfreigabe","Kollektionsfreigabe","Übergabe prüfen","Aus Shop entfernen","Freigabe ausstehend","Übergabebereit","Im Shop","Übergabe gesperrt: Freigaben fehlen.","Produkt an Test-Shop übergeben.","Produkt entfernt.","Synthetischer Shop-Eintrag","Produktname erforderlich.","Merchandise benötigt Kollektionsfreigabe."],"pt":["Aceitação → loja","Apenas teste simulado. Sem catálogo, pagamentos ou arquivos reais.","Nome do produto","Tipo de produto","Físico","Digital","Loja de destino","Marketplace","Merchandise","Aprovação do vendedor","Aprovação do produto","Aprovação da coleção","Verificar transferência","Remover da loja","Aguardando aprovação","Pronto para transferir","Na loja","Transferência bloqueada: faltam aprovações.","Produto transferido para a loja simulada.","Produto removido.","Registro da loja simulada","Nome obrigatório.","Merchandise exige aprovação da coleção."],"ru":["Приёмка → витрина","Только тест. Нет реального каталога, оплаты или файлов.","Название товара","Тип товара","Физический","Цифровой","Магазин","Marketplace","Merchandise","Одобрение продавца","Одобрение товара","Одобрение коллекции","Проверить передачу","Убрать из магазина","Ожидает","Готов к передаче","В магазине","Передача заблокирована: нет разрешений.","Товар передан в тестовую витрину.","Товар удалён.","Запись тестовой витрины","Укажите название.","Для Merchandise нужно одобрение коллекции."],"zh":["审核 → 商店移交","仅为模拟测试，不涉及真实目录、支付或文件。","商品名称","商品类型","实体","数字","目标商店","Marketplace","Merchandise","卖家批准","商品批准","系列批准","验证移交","从商店移除","等待批准","准备移交","已上架","移交受阻：缺少批准。","商品已移交模拟商店。","商品已移除。","模拟商店记录","必须填写商品名称。","Merchandise 需要系列批准。"]},state={seller:false,product:false,collection:false,placed:false,record:null,sellerStep:'none',productStep:'none',sellerName:'',productName:'',submittedType:'physical',submittedTarget:'marketplace'};const $=id=>document.getElementById(id);let lang='tr',feedback=-1;const t=i=>dict[lang][i],eligible=()=>state.sellerStep==='approved'&&state.productStep==='approved'&&($('target').value!=='merchandise'||state.collection)&&$('name').value.trim().length>0;function render(){ $('submitSeller').disabled=state.sellerStep!=='none';$('approveSeller').disabled=$('rejectSeller').disabled=state.sellerStep!=='pending';$('submitProduct').disabled=state.sellerStep!=='approved'||state.productStep!=='none';$('name').readOnly=state.productStep!=='none';$('type').disabled=state.productStep!=='none';$('target').disabled=state.productStep!=='none';$('approveProduct').disabled=$('rejectProduct').disabled=state.productStep!=='pending';$('approveCollection').disabled=state.productStep!=='approved'||$('target').value!=='merchandise'||state.collection;$('sellerStatus').textContent=state.sellerStep;$('productStatus').textContent=state.productStep;document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('lang').value=lang;$('heading').textContent=t(0);$('notice').textContent=t(1);$('nameLabel').textContent=t(2);$('typeLabel').textContent=t(3);$('targetLabel').textContent=t(6);$('type').options[0].textContent=t(4);$('type').options[1].textContent=t(5);$('target').options[0].textContent=t(7);$('target').options[1].textContent=t(8);$('checks').replaceChildren();[[9,'seller'],[10,'product'],...($('target').value==='merchandise'?[[11,'collection']]:[])].forEach(([i,key])=>{const label=document.createElement('label');label.className='check';const input=document.createElement('input');input.type='checkbox';input.checked=state[key];input.disabled=true;label.append(input,document.createTextNode(t(i)));$('checks').append(label)});$('place').textContent=t(12);$('remove').textContent=t(13);$('place').disabled=state.placed||!eligible();$('remove').disabled=!state.placed;$('status').textContent=t(state.placed?16:eligible()?15:14);$('feedback').textContent=feedback<0?'':t(feedback);$('preview').hidden=!state.placed;$('previewLabel').textContent=t(20);if(state.record){$('previewName').textContent=state.record.name;$('previewDetails').textContent=(state.record.target==='marketplace'?t(7):t(8))+' · '+(state.record.type==='physical'?t(4):t(5))}}function invalidate(){state.placed=false;state.record=null;feedback=-1}function getLanguage(){const m=location.hash.match(/^#lang=(en|tr|ar|es|fr|de|pt|ru|zh)$/);return m?m[1]:'tr'}$('lang').onchange=()=>{lang=$('lang').value;history.replaceState(null,'',location.pathname+location.search+'#lang='+lang);render()};window.addEventListener('hashchange',()=>{lang=getLanguage();render()});['name','type','target'].forEach(id=>$(id).addEventListener(id==='name'?'input':'change',()=>{if(state.productStep!=='none'){$(id).value=id==='name'?state.productName:id==='target'?state.submittedTarget:state.submittedType;return}invalidate();render()}));$('submitSeller').onclick=()=>{if(state.sellerStep!=='none')return;if(!$('sellerName').value.trim()||!$('sellerInfo').value.trim()){feedback=21;render();return}state.sellerName=$('sellerName').value.trim();state.sellerStep='pending';render()};function reviewSeller(v){if(state.sellerStep!=='pending'||!$('reason').value.trim()){feedback=17;render();return}state.sellerStep=v;state.seller=v==='approved';$('reason').value='';render()}$('approveSeller').onclick=()=>reviewSeller('approved');$('rejectSeller').onclick=()=>reviewSeller('rejected');$('submitProduct').onclick=()=>{if(state.sellerStep!=='approved'||state.productStep!=='none'||!$('name').value.trim()){feedback=21;render();return}state.productName=$('name').value.trim();state.submittedType=$('type').value;state.submittedTarget=$('target').value;state.productStep='pending';render()};function reviewProduct(v){if(state.productStep!=='pending'||!$('reason').value.trim()){feedback=17;render();return}state.productStep=v;state.product=v==='approved';$('reason').value='';render()}$('approveProduct').onclick=()=>reviewProduct('approved');$('rejectProduct').onclick=()=>reviewProduct('rejected');$('approveCollection').onclick=()=>{if(state.productStep!=='approved'||$('target').value!=='merchandise'||!$('reason').value.trim())return;state.collection=true;$('reason').value='';render()};$('place').onclick=()=>{if(!eligible()){feedback=17;render();return}state.record=Object.freeze({name:state.productName,type:state.submittedType,target:state.submittedTarget,seller:state.sellerName,mode:'synthetic_demo',published:false});state.placed=true;feedback=18;render()};$('remove').onclick=()=>{invalidate();feedback=19;render()};lang=getLanguage();render()})();</script></body></html>
