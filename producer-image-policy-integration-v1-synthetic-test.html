<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Echoes · Görsel Yetki Entegrasyon Testi</title><style>body{background:#061725;color:#e5f5f7;font:16px/1.5 system-ui;margin:0;padding:24px}main{max-width:650px;margin:auto}section{background:#0c2938;border:1px solid #3a7b82;border-radius:16px;padding:18px}button{background:#54cfc1;color:#07262a;border:0;border-radius:10px;padding:13px;font:inherit;font-weight:bold}pre{white-space:pre-wrap;overflow-wrap:anywhere}.pass{color:#8ff3ca}.fail{color:#ffafa8}</style><main><p>ECHOES OF HUMANITY · SYNTHETIC ONLY</p><h1>Görsel revizyonu ve yayın yetkisi</h1><p>Bu sayfa gerçek ürün, kullanıcı, ödeme veya yayın işlemi yapmaz. Bağımsız test dalındaki yetki motorunu sınar.</p><section><button id="run">Sentetik kontrolleri çalıştır</button><pre id="out" aria-live="polite">Test henüz çalıştırılmadı.</pre></section></main><script src="assets/js/producer-publication-policy-v1-synthetic.js"></script><script>document.getElementById('run').onclick=()=>{const out=document.getElementById('out');try{const p=window.EchoesProducerPublicationPolicyV1;const result=p.selfTest();if(result.passed!==13)throw Error('Beklenen test sayısı 13, alınan '+result.passed);out.className='pass';out.textContent='BAŞARILI: '+result.passed+' otomatik kontrol\n\n'+result.checks.map((x,i)=>(i+1)+'. '+x).join('\n')}catch(e){out.className='fail';out.textContent='BAŞARISIZ: '+e.message}};</script></html>
