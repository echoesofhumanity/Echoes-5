<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#071218"><title>Echoes Radio — Rotating Earth Test</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;background:radial-gradient(ellipse at 50% 35%,#103d58,#071218 70%);color:#e6f8fc;font-family:system-ui,sans-serif;display:grid;place-items:center;text-align:center;padding:20px}
main{width:min(100%,440px)}h1{font:400 clamp(26px,7vw,38px) Georgia,serif;margin:0 0 8px}p{font-size:14px;color:#a9ccd7;line-height:1.5}.stage{position:relative;width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;isolation:isolate}.stage::before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,transparent 51%,rgba(18,177,220,.10) 66%,rgba(32,207,244,.16) 72%,transparent 81%);filter:blur(13px);pointer-events:none}.stage::after{content:"";position:absolute;width:73%;height:10%;bottom:10%;border-top:1px solid rgba(80,224,246,.62);border-radius:50%;background:radial-gradient(ellipse at top,rgba(22,180,223,.17),transparent 72%);box-shadow:0 -5px 20px rgba(25,194,231,.12);pointer-events:none}canvas{display:block;flex:0 1 auto;min-width:0;max-width:100%;width:100%;height:auto;aspect-ratio:1;touch-action:pan-y}.status{min-height:42px}.note{font-size:12px;opacity:.7}
@media(prefers-reduced-motion:reduce){.note{opacity:1}}
</style></head><body><main><h1>Echoes Radio</h1><p>Rotating Earth · visual performance test</p><div class="stage" id="stage" aria-label="Slowly rotating 3D Earth"></div><p class="status" id="status">Preparing the globe…</p><p class="note">Visual test only. Radio playback is not modified.</p></main>
<script type="module">
const stage=document.getElementById("stage"),status=document.getElementById("status");
const nightStatus=document.createElement("p");nightStatus.className="note";nightStatus.setAttribute("role","status");nightStatus.textContent="Night lights: checking texture…";status.insertAdjacentElement("afterend",nightStatus);
try{
const THREE=await import("https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js");
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,1,.1,100);camera.position.z=5.3;
const renderer=new THREE.WebGLRenderer({alpha:true,antialias:true,powerPreference:"low-power"});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(stage.clientWidth,stage.clientWidth);renderer.outputColorSpace=THREE.SRGBColorSpace;stage.appendChild(renderer.domElement);
const geometry=new THREE.SphereGeometry(1.45,64,48);
const texture=await new THREE.TextureLoader().loadAsync("https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg");texture.colorSpace=THREE.SRGBColorSpace;
const globe=new THREE.Group();globe.rotation.set(.08,-1.15,.15);scene.add(globe);
const earth=new THREE.Mesh(geometry,new THREE.MeshPhongMaterial({map:texture,emissiveMap:texture,emissive:0x284a5a,emissiveIntensity:.5,shininess:5,specular:0x173b50}));globe.add(earth);
// Independent city-light layer: visible mainly on the night side of the rotating globe.
try {
  const nightMap=await new THREE.TextureLoader().loadAsync("https://threejs.org/examples/textures/planets/earth_lights_2048.png");
  nightMap.colorSpace=THREE.SRGBColorSpace;
  nightStatus.textContent="Night lights: texture loaded · checking WebGL shader…";
  const lights=new THREE.Mesh(new THREE.SphereGeometry(1.455,64,48),new THREE.ShaderMaterial({
    uniforms:{nightMap:{value:nightMap},sunDirection:{value:new THREE.Vector3(4,2,5).normalize()}},
    vertexShader:`varying vec2 vUv;varying vec3 vWorldNormal;void main(){vUv=uv;vWorldNormal=normalize(mat3(modelMatrix)*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform sampler2D nightMap;uniform vec3 sunDirection;varying vec2 vUv;varying vec3 vWorldNormal;void main(){float night=smoothstep(-0.12,0.36,-dot(normalize(vWorldNormal),normalize(sunDirection)));vec3 city=texture2D(nightMap,vUv).rgb;gl_FragColor=vec4(city*night*1.45,night);}`,
    transparent:true,blending:THREE.AdditiveBlending,depthWrite:false
  }));globe.add(lights);
  renderer.compile(scene,camera);
  // Diagnostic toggle: isolate the city-light texture from the night-side mask.
  const diagnostic=document.createElement("button");
  diagnostic.type="button";
  diagnostic.textContent="Show city-light layer (diagnostic)";
  diagnostic.style.cssText="margin:8px auto 12px;padding:12px 16px;border:1px solid #39cde8;border-radius:24px;background:#082b3b;color:#e6f8fc;font:inherit;cursor:pointer";
  nightStatus.insertAdjacentElement("afterend",diagnostic);
  let isolated=false;
  diagnostic.addEventListener("click",()=>{
    isolated=!isolated;
    earth.visible=!isolated;
    lights.material.uniforms.sunDirection.value.set(0,0,-1);
    lights.material.fragmentShader=isolated
      ? `uniform sampler2D nightMap;uniform vec3 sunDirection;varying vec2 vUv;varying vec3 vWorldNormal;void main(){vec3 city=texture2D(nightMap,vUv).rgb;gl_FragColor=vec4(city*2.0,1.0);}`
      : `uniform sampler2D nightMap;uniform vec3 sunDirection;varying vec2 vUv;varying vec3 vWorldNormal;void main(){float night=smoothstep(-0.12,0.36,-dot(normalize(vWorldNormal),normalize(sunDirection)));vec3 city=texture2D(nightMap,vUv).rgb;gl_FragColor=vec4(city*night*1.45,night);}`;
    lights.material.uniforms.sunDirection.value.set(4,2,5).normalize();
    lights.material.needsUpdate=true;
    diagnostic.textContent=isolated?"Return to normal globe":"Show city-light layer (diagnostic)";
    nightStatus.textContent=isolated?"Diagnostic: city-light texture only":"Night lights: texture loaded · normal globe";
  });
  nightStatus.textContent="Night lights: texture loaded · diagnostic available";
} catch(error) { nightStatus.textContent="Night lights: texture FAILED — "+(error?.message||"network or decoding error"); console.warn("Optional city lights unavailable; daytime globe remains active",error); }
const atmosphere=new THREE.Mesh(new THREE.SphereGeometry(1.49,64,48),new THREE.MeshBasicMaterial({color:0x28cbe8,transparent:true,opacity:.15,side:THREE.BackSide}));scene.add(atmosphere);
scene.add(new THREE.AmbientLight(0xa3d4e7,1.65));const sun=new THREE.DirectionalLight(0xfff2df,2.8);sun.position.set(4,2,5);scene.add(sun);
const rim=new THREE.DirectionalLight(0x00c8f0,2.2);rim.position.set(-4,0,-2);scene.add(rim);
let visible=true;const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const observer=new IntersectionObserver(entries=>{visible=entries[0].isIntersecting});observer.observe(stage);
function resize(){const w=stage.clientWidth;renderer.setSize(w,w,false);camera.aspect=1;camera.updateProjectionMatrix()}resize();addEventListener("resize",resize,{passive:true});
let last=0;function animate(now){requestAnimationFrame(animate);if(!visible||document.hidden)return;if(!reduced&&last)globe.rotation.y+=(now-last)*Math.PI*2/90000;last=now;renderer.render(scene,camera)}requestAnimationFrame(animate);
status.textContent=reduced?"Globe ready · motion reduced by device settings":"Globe ready · one rotation every 90 seconds";
}catch(err){status.textContent="3D preview could not load. Check browser/WebGL and connection.";console.error("Echoes Earth preview",err)}
</script></body></html>
