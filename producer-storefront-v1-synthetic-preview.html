rator":true}],state=items.map(()=>({seller:false,product:false,curator:false,placed:false}));let lang='tr';const $=id=>document.getElementById(id),t=i=>dict[lang][i];function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';$('language').value=lang;$('title').textContent=t(0);$('intro').textContent=t(1);$('notice').textContent=t(23);$('cards').replaceChildren();items.forEach((item,i)=>{const st=state[i],card=document.createElement('article');card.className='card'+(st.placed?' placed':'');const art=document.createElement('div');art.className='art '+item.color;art.textContent=item.art;art.setAttribute('role','img');art.setAttribute('aria-label',t(20));card.append(art);const body=document.createElement('div');body.className='body';const group=document.createElement('div');group.className='type';group.textContent=t(item.group);const title=document.createElement('h2');title.textContent=t(item.name);const type=document.createElement('div');type.className='type';type.textContent=t(item.type);body.append(group,title,type);const checks=document.createElement('div');checks.className='checks';[[11,'seller'],[12,'product'],...(item.curator?[[13,'curator']]:[])].forEach(([key,field])=>{const label=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.checked=st[field];box.addEventListener('change',()=>{st[field]=box.checked;if(!st.seller||!st.product||(item.curator&&!st.curator))st.placed=false;render()});label.append(box,document.createTextNode(t(key)));checks.append(label)});body.append(checks);const actions=document.createElement('div');actions.className='actions';const place=document.createElement('button');place.className='primary';place.textContent=t(14);place.disabled=st.placed||!st.seller||!st.product||(item.curator&&!st.curator);place.onclick=()=>{st.placed=true;render()};const remove=document.createElement('button');remove.textContent=t(15);remove.disabled=!st.placed;remove.onclick=()
